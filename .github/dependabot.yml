# Mises à jour automatiques des dépendances (une PR par mise à jour)
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
