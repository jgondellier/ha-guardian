name: Image Docker

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Contrôle de syntaxe
        run: |
          python -m py_compile app/*.py
          node --check app/static/app.js

      - name: Version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-guardian:latest
            ghcr.io/${{ github.repository_owner }}/ha-guardian:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ha-guardian:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
